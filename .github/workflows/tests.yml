name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the layout engine and the PDF validator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            python3-uno \
            qpdf
          /usr/bin/python3 -c "import uno"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show what the tool found
        run: python main.py doctor

      - name: Run the test suite
        env:
          VKR_TEST_PDF: "1"
        run: python -m pytest src/tests -q -rs

      - name: Build the bundled example
        run: |
          python main.py lint
          python main.py build --pagination-engine libreoffice --pdf --pdf-engine libreoffice

      - name: Keep the built document
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: VKR-example
          path: |
            example/VKR-example.docx
            example/VKR-example.pdf
          retention-days: 14
          if-no-files-found: error
