# See https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-docx-and-yaml:
        patterns:
          - python-docx
          - PyYAML
      dev-tools:
        patterns:
          - pytest
          - watchdog

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
