# =============================================================================
# User config for vkr-builder (your thesis / project).
# =============================================================================
#
# Run from this folder:
#     vkr-builder.bat build          Windows
#     ./vkr-builder.sh build         Linux/macOS
#
# Merged on top of config.defaults.yaml - your keys win.
# All settings with comments: config.defaults.yaml
# Commands and CLI flags: vkr-builder help
#
# =============================================================================

# Profile used when --profile is not passed.
active_profile: example

# One profile = one document variant (thesis, example, test).
profiles:
  example:
    docx: example/VKR-example.docx
    markdown_dir: example/md
    images_dir: example/images
    listings_dir: example/listings
    markdown_files:
      - 01-abbreviations.md
      - 02-terms.md
      - 03-introduction.md
      - 04-chapter1.md
      - 05-chapter2.md
      - 06-conclusion.md
      - 07-sources.md
      - 08-appendix-a.md
      - 09-appendix-b.md
      - 10-appendix-c.md

# -----------------------------------------------------------------------------
# Build settings (defaults in config.defaults.yaml)
# -----------------------------------------------------------------------------

build:
  # auto = use whatever is installed: Word first, else LibreOffice.
  pagination_engine: auto

# Other overrides - uncomment what you need.
